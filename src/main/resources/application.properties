spring.application.name=mini-wsa

# --- Database connection (PostgreSQL in Docker, see compose.yaml) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/miniwsa
spring.datasource.username=miniwsa
spring.datasource.password=miniwsa

# --- JPA ---
spring.jpa.open-in-view=false

# --- Actuator: show component details (e.g. db) in /actuator/health ---
management.endpoint.health.show-details=always